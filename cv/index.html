<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CV — Melvin Tabitha</title>
  <meta name="description" content="Read or download Melvin Tabitha's CV and resume.">
  <meta name="theme-color" content="#0b0e13">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/main.css?v=16">
  <script>document.documentElement.classList.replace("no-js","js");</script>
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("melvin.theme");
        theme = saved || (
          window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark"
        );
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", theme === "light" ? "#f8f7f4" : "#0b0e13");
    })();
  </script>
</head>
<body class="cv-viewer">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="cv-bar">
    <div class="cv-bar-inner">
      <a class="btn btn-ghost cv-back" id="cv-back" href="../index.html#cv">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back to portfolio</span>
      </a>
      <p class="cv-title" id="cv-title">CV</p>
      <a class="btn cv-download" id="cv-download" href="Melvin-Tabitha-CV.pdf?v=6" download="Melvin-Tabitha-CV.pdf">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <main id="main" class="cv-pages" aria-label="Document pages">
    <p class="cv-status" id="cv-status" role="status">Loading…</p>
    <noscript>
      <p class="cv-status">This preview needs JavaScript. <a href="Melvin-Tabitha-CV.pdf?v=6">Open the CV as a PDF</a> or <a href="Melvin-Tabitha-Resume.pdf?v=6">the resume</a>.</p>
    </noscript>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="../js/cv-viewer.js?v=3" defer></script>
</body>
</html>
